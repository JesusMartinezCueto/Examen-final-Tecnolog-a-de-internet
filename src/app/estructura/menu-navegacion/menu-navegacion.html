<ul class="navbar-nav ms-auto">
  @for (opcion of opciones; track opcion.ruta) {
    <li class="nav-item">
      <a
        class="nav-link"
        [routerLink]="opcion.ruta"
        routerLinkActive="active fw-semibold"
        [routerLinkActiveOptions]="{ exact: opcion.exacta }"
        (click)="navegar.emit()"
        >{{ opcion.texto }}</a
      >
    </li>
  }
</ul>
